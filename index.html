<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EMOM" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>EMOM</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Apple touch icon (optional — add a 180x180 PNG as icon.png to use) -->
  <!-- <link rel="apple-touch-icon" href="icon.png" /> -->
</head>
<body>

  <!-- ── Onboarding ─────────────────────────────────────────────────────── -->
  <div id="onboarding" class="screen active">
    <div class="onboarding-content">
      <h1 class="app-title">EMOM</h1>
      <p class="subtitle">Choose your theme</p>

      <div class="theme-grid">
        <button class="theme-btn active" data-theme="default" onclick="selectTheme('default')">
          <div class="theme-preview theme-preview--default"></div>
          <span>Slate</span>
        </button>
        <button class="theme-btn" data-theme="blue" onclick="selectTheme('blue')">
          <div class="theme-preview theme-preview--blue"></div>
          <span>Blue</span>
        </button>
        <button class="theme-btn" data-theme="green" onclick="selectTheme('green')">
          <div class="theme-preview theme-preview--green"></div>
          <span>Green</span>
        </button>
        <button class="theme-btn" data-theme="crimson" onclick="selectTheme('crimson')">
          <div class="theme-preview theme-preview--crimson"></div>
          <span>Crimson</span>
        </button>
      </div>

      <button class="btn-primary btn-lg" onclick="enterApp()">Enter</button>
    </div>
  </div>

  <!-- ── App ────────────────────────────────────────────────────────────── -->
  <div id="app" class="screen">

    <header class="top-bar">
      <span class="app-name">EMOM</span>
      <button class="icon-btn" onclick="toggleSettings()" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <main id="tab-content">
      <div id="tab-home"      class="tab-pane active"></div>
      <div id="tab-emom"      class="tab-pane"></div>
      <div id="tab-superset"  class="tab-pane"></div>
      <div id="tab-cards"     class="tab-pane"></div>
      <div id="tab-saved"     class="tab-pane"></div>
      <div id="tab-sync"      class="tab-pane"></div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="home" onclick="switchTab('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-btn" data-tab="emom" onclick="switchTab('emom')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>EMOM</span>
      </button>

      <button class="nav-btn" data-tab="superset" onclick="switchTab('superset')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <rect x="3" y="3" width="8" height="8" rx="1"/>
          <rect x="13" y="3" width="8" height="8" rx="1"/>
          <rect x="3" y="13" width="8" height="8" rx="1"/>
          <rect x="13" y="13" width="8" height="8" rx="1"/>
        </svg>
        <span>Superset</span>
      </button>

      <button class="nav-btn" data-tab="cards" onclick="switchTab('cards')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <path d="M12 8v4M10 10h4"/>
        </svg>
        <span>Cards</span>
      </button>

      <button class="nav-btn" data-tab="saved" onclick="switchTab('saved')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Saved</span>
      </button>

      <button class="nav-btn" data-tab="sync" onclick="switchTab('sync')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Sync</span>
      </button>
    </nav>
  </div>

  <!-- ── PeerJS (WebRTC sync — no account needed) ──────────────────────── -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- ── Firebase (optional — community sharing only) ──────────────────── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/audio.js?v=2"></script>
  <script src="js/storage.js?v=2"></script>
  <script src="js/home.js?v=2"></script>
  <script src="js/sync.js?v=2"></script>
  <script src="js/emom.js?v=2"></script>
  <script src="js/superset.js?v=2"></script>
  <script src="js/cards.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
